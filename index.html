<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Phishing Aquarium — Spot Phishing Lures &amp; Collect Species</title>
  <meta name="description" content="Dive into The Phishing Aquarium, an interactive arcade game where you inspect suspicious email fish, spot 3 red flags per lure, and collect all 8 species." />
  <meta property="og:title" content="The Phishing Aquarium" />
  <meta property="og:description" content="Inspect suspicious email fish, spot 3 red flags per lure, and catch all 8 phishing species in a retro deep-ocean aquarium." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230C3A5B'/%3E%3Cpath d='M16 32 C24 18, 42 19, 50 32 C42 45, 24 46, 16 32 Z' fill='%23D85A30' stroke='%23111318' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M17 29 L7 22 L10 32 L7 42 L17 35 Z' fill='%23D85A30' stroke='%23111318' stroke-width='3.5' stroke-linejoin='round'/%3E%3Ccircle cx='42' cy='30' r='3.5' fill='%23FFFFFF' stroke='%23111318' stroke-width='2.5'/%3E%3Ccircle cx='43' cy='30' r='1.5' fill='%23111318'/%3E%3Crect x='26' y='26' width='12' height='9' rx='1.5' fill='%23FFFFFF' stroke='%23111318' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="starfield" aria-hidden="true"></div>
  <div class="vignette-overlay" aria-hidden="true"></div>
  <div id="catch-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <main class="app-shell">
    <header class="top-bar">
      <h1 class="game-title">The Phishing Aquarium</h1>
      <div class="hud-pills" aria-label="Game statistics">
        <div class="pill pill-score" aria-live="polite">
          <span>Score</span>
          <strong id="score-display">0</strong>
        </div>
        <div class="pill pill-caught" aria-live="polite">
          <span>Caught</span>
          <strong id="caught-display">0 / 8</strong>
        </div>
      </div>
    </header>

    <section class="aquarium-console" aria-label="Phishing Aquarium Console">
      <div class="console-lip stippled-band" aria-hidden="true"></div>

      <div class="tank-stage">
        <div class="tank-viewport">
          <div class="water-top-band" aria-hidden="true">
            <svg class="wave-svg" viewBox="0 0 1200 28" preserveAspectRatio="none">
              <path class="wave-path" d="M0,14 C150,24 300,4 450,14 C600,24 750,4 900,14 C1050,24 1200,4 1350,14 L1350,28 L0,28 Z" />
            </svg>
          </div>
          <canvas id="tank" width="1040" height="460" aria-label="Interactive aquarium tank with swimming email fish" tabindex="0"></canvas>
        </div>

        <aside id="inspector-card" class="inspector-card is-empty" aria-label="Email inspector" aria-live="polite">
          <div class="inspector-empty-state">
            <div class="empty-envelope-icon" aria-hidden="true">✉</div>
            <p class="empty-title">Tap a fish to inspect it</p>
            <p class="empty-sub">Spot the red flags in suspicious emails before they slip away.</p>
          </div>
        </aside>
      </div>

      <div class="console-divider stippled-band" aria-hidden="true"></div>

      <footer class="console-deck">
        <div class="collection-group">
          <span class="deck-label" id="collection-label">Your collection</span>
          <div class="collection-slots" role="list" aria-labelledby="collection-label">
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 1">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 2">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 3">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 4">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 5">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 6">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 7">?</div>
            <div class="slot slot-empty" role="listitem" aria-label="Empty collection slot 8">?</div>
          </div>
        </div>

        <div class="deck-controls">
          <a href="collection.html" class="pill-btn field-guide-btn">Field guide</a>
          <div class="power-switch" role="img" aria-label="Console power switch indicator">
            <span class="switch-rocker"></span>
            <span class="switch-line"></span>
          </div>
        </div>
      </footer>
    </section>

    <div class="console-base stippled-band" aria-hidden="true"></div>
    <div class="console-feet" aria-hidden="true">
      <span class="foot"></span>
      <span class="foot"></span>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/tank.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
